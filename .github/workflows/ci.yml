name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    # Supersede only obsolete PR checks; never interrupt a main validation or deployment.
    concurrency:
      group: foundation-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Keep Playwright system dependencies on a stable supported LTS runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Intelligence foundation — offline adapter and observation tests
        run: |
          docker compose -f services/intelligence/compose.yaml config --quiet
          docker compose -f services/intelligence/compose.yaml build fixture
          docker compose -f services/intelligence/compose.yaml run --rm -T fixture python -m unittest discover -s tests -v
          docker compose -f services/intelligence/compose.yaml run --rm -T fixture
      - name: Intelligence pilot — controlled loopback TLS verification
        env:
          BAKATA_REQUIRE_TLS_TEST: '1'
          PYTHONPATH: services/intelligence
        run: python3 -m unittest discover -s services/intelligence/tests -p test_pilot_tls.py -v
      - name: Intelligence jobs — persistent offline scheduler smoke
        shell: bash
        run: |
          docker compose -f services/intelligence/compose.yaml --profile jobs config --quiet
          docker compose -f services/intelligence/compose.yaml --profile jobs build scheduler
          docker compose -f services/intelligence/compose.yaml run --rm -T scheduler enqueue ci-fixture --due 0
          docker compose -f services/intelligence/compose.yaml run --rm -T scheduler run-once
          docker compose -f services/intelligence/compose.yaml run --rm -T scheduler list | python3 -c 'import sys,json; rows=json.load(sys.stdin); assert len(rows)==1 and rows[0]["status"]=="succeeded" and rows[0]["attempts"]==1'
          docker compose -f services/intelligence/compose.yaml run --rm -T scheduler result ci-fixture > /tmp/bakata-job-result.json
          python3 -c 'import json; s=json.load(open("/tmp/bakata-job-result.json")); assert s["mode"]=="fixture" and s["rows"][0]["score_bp"]==7777'
      - name: Intelligence release — runtime isolation and resource limits
        shell: bash
        run: |
          mkdir -p qa/reports
          docker compose -f services/intelligence/compose.yaml run --rm -T fixture python -m intelligence.release_probe | tee qa/reports/intelligence-fixture-runtime.json
          docker compose -f services/intelligence/compose.yaml run --rm -T --entrypoint python scheduler -m intelligence.release_probe | tee qa/reports/intelligence-scheduler-runtime.json
          docker compose -f services/intelligence/compose.yaml --profile jobs config --format json | python3 -c 'import sys,json; s=json.load(sys.stdin)["services"]; assert set(s)=={"fixture","scheduler"}; assert all(not x.get("ports") and not x.get("privileged") for x in s.values()); assert s["scheduler"]["profiles"]==["jobs"]'
      - name: Intelligence preview — Python to PHP snapshot contract
        run: |
          docker compose -f services/intelligence/compose.yaml run --rm -T fixture python -m intelligence.admin_export > /tmp/bakata-intelligence-preview.json
          docker run --rm -i -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-intelligence-preview.php < /tmp/bakata-intelligence-preview.json
      - name: Validate PHP syntax
        run: docker run --rm -v "$PWD/wp-content:/src:ro" php:8.3-cli sh -c 'find /src -name "*.php" -exec php -l {} +'
      - name: Supplier foundation — isolated contract and preview tests
        run: docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-supplier-foundation.php
      - name: Pricing preview — isolated unit economics tests
        run: docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-pricing-preview.php
      - name: Inventory preview — isolated reconciliation tests
        run: docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-inventory-preview.php
      - name: Order preview — isolated eligibility and grouping tests
        run: docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-order-preview.php
      - name: Fulfillment preview — isolated state machine and group tests
        run: docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-fulfillment-preview.php
      - name: Webhook reference protocol — isolated signature and receipt tests
        run: docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-webhook-receipts.php
      - name: Validate theme JSON and shell
        run: |
          python3 -m json.tool wp-content/themes/bakata/theme.json > /dev/null
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n infra/letsencrypt/reload-nginx.sh
          python3 -m py_compile scripts/upload-backup.py
          cp .env.example .env
          docker compose config --quiet
          docker compose config --services | python3 -c 'import sys; assert not {"fixture","scheduler","intelligence"}.intersection(sys.stdin.read().splitlines())'
      - name: Validate design system tokens and assets
        run: python3 scripts/check_design_system.py
      - name: Bootstrap local store
        run: bash scripts/bootstrap.sh
      - name: Smoke test
        run: |
          docker compose run --rm -T cli wp core is-installed
          docker compose run --rm -T cli wp plugin is-active woocommerce
          docker compose run --rm -T cli wp plugin is-active bakata-core
          docker compose run --rm -T cli wp theme is-active bakata
          curl --fail --silent --show-error --retry 5 http://localhost:8080/ -o /tmp/bakata-home.html
          grep -F 'Pequeños cambios. Grandes días.' /tmp/bakata-home.html
          grep -F 'design-system.css' /tmp/bakata-home.html
          grep -F 'bk-store-header' /tmp/bakata-home.html
          grep -F 'logo-horizontal.svg' /tmp/bakata-home.html
          grep -F 'name="post_type" value="product"' /tmp/bakata-home.html
          grep -F 'fonts.css' /tmp/bakata-home.html
          grep -F 'class="bk-hero"' /tmp/bakata-home.html
          grep -F 'class="bk-button bk-hero__cta"' /tmp/bakata-home.html
          grep -F 'hero-editorial.webp' /tmp/bakata-home.html
          grep -F 'hero.css' /tmp/bakata-home.html
          curl --fail --silent --show-error http://localhost:8080/wp-content/themes/bakata/assets/images/hero-editorial.webp -o /tmp/bakata-hero.webp
          test "$(git hash-object /tmp/bakata-hero.webp)" = '0148bd8d5d3fe350c65e37833549b72f66680909'
          curl --fail --silent --show-error http://localhost:8080/wp-content/themes/bakata/assets/fonts/inter.woff2 -o /tmp/bakata-inter.woff2
          test "$(git hash-object /tmp/bakata-inter.woff2)" = '5a8d3e72ad7ffb62af3b146e1b1f54ab5813a212'
          curl --fail --silent --show-error http://localhost:8080/wp-content/themes/bakata/assets/css/design-system.css -o /tmp/bakata-design-system.css
          grep -F -- '--bk-primary: #1F3A37' /tmp/bakata-design-system.css
      - name: Install isolated browser QA tools
        run: |
          npm --prefix qa install --ignore-scripts --no-audit --no-fund --package-lock=false
          qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Intelligence Dropify — catalog-only bridge contract
        env:
          PYTHONPATH: services/intelligence
          BAKATA_BRIDGE_FIXTURE: '1'
        run: |
          php -l tools/dropify-quarantine/catalog-bridge.php
          php scripts/test-dropify-catalog-bridge.php
          python3 -m intelligence.dropify_bridge --db /tmp/bakata-dropify-bridge.sqlite ingest /tmp/bakata-dropify-bridge-fixture.json --operator ci-fixture
          python3 -m intelligence.dropify_bridge --db /tmp/bakata-dropify-bridge.sqlite candidates --store 7 --in-stock | python3 -c 'import json,sys; rows=json.load(sys.stdin); assert len(rows)==1 and rows[0]["base_price"]=="7000.25" and rows[0]["sku"]=="025216"'
      - name: Intelligence catalog review — archived page export and PHP validation
        env:
          PYTHONPATH: services/intelligence
        run: |
          sha=$(sha256sum /tmp/bakata-dropify-bridge-fixture.json | cut -d ' ' -f 1)
          python3 -m intelligence.catalog_review --db /tmp/bakata-dropify-bridge.sqlite --page-sha256 "$sha" > /tmp/bakata-catalog-review.json
          php scripts/test-catalog-review.php < /tmp/bakata-catalog-review.json
      - name: Intelligence Dropify — visible catalog export and offline archive
        env:
          PYTHONPATH: services/intelligence
        run: |
          node --check wp-content/plugins/bakata-core/assets/dropify-visible-export.js
          node qa/dropify-visible-export.mjs
          python3 -m intelligence.dropify_catalog --db /tmp/bakata-dropify-fixture.sqlite ingest /tmp/bakata-dropify-visible-fixture.json --operator-ref ci-fixture
          python3 -m intelligence.dropify_catalog --db /tmp/bakata-dropify-fixture.sqlite candidates --in-stock | python3 -c 'import json,sys; rows=json.load(sys.stdin); assert len(rows)==1 and rows[0]["displayed_spread"]==10000 and rows[0]["sku"]=="025216"'
      - name: Browser QA — administrator intelligence preview
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          export BAKATA_CI_INTELLIGENCE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$BAKATA_CI_INTELLIGENCE_PASSWORD"
          docker compose run --rm -T cli wp user create ci-bakata-intelligence-reader intelligence-reader@example.test --role=subscriber --user_pass="$BAKATA_CI_INTELLIGENCE_PASSWORD" --porcelain
          node --check qa/intelligence-admin.mjs
          node qa/intelligence-admin.mjs
      - name: Browser QA — empty catalog
        env:
          BAKATA_CI_FIXTURES: '1'
        run: npm --prefix qa run empty
      - name: Verify empty and populated homepage catalog
        run: |
          grep -F 'class="bk-catalog-section bk-categories"' /tmp/bakata-home.html
          grep -F 'class="bk-catalog-section bk-featured"' /tmp/bakata-home.html
          test "$(grep -o 'class="bk-catalog-empty"' /tmp/bakata-home.html | wc -l)" -eq 2
          php -l scripts/catalog-fixtures-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/catalog-fixtures-ci.php)"
          curl --fail --silent --show-error http://localhost:8080/ -o /tmp/bakata-catalog.html
          grep -F 'CI Category Alpha' /tmp/bakata-catalog.html
          grep -F 'CI Featured Visible' /tmp/bakata-catalog.html
          grep -F 'CI Featured Catalog Only' /tmp/bakata-catalog.html
          grep -F 'name="add-to-cart"' /tmp/bakata-catalog.html
          grep -F 'woocommerce-Price-amount' /tmp/bakata-catalog.html
          test "$(grep -o 'class="bk-card bk-product-card"' /tmp/bakata-catalog.html | wc -l)" -eq 3
          grep -F 'class="bk-catalog-section bk-recent"' /tmp/bakata-catalog.html
          grep -F 'CI Not Featured' /tmp/bakata-catalog.html
          if grep -Fq 'class="bk-catalog-section bk-recent"' /tmp/bakata-home.html; then
            echo 'Empty recent section exposed'; exit 1
          fi
          if grep -Eq 'CI Featured Hidden|CI Featured Search Only|CI Featured Draft' /tmp/bakata-catalog.html; then
            echo 'Non-catalog product leaked'; exit 1
          fi
      - name: Verify footer and service links
        run: |
          grep -F 'class="bk-trust"' /tmp/bakata-home.html
          grep -F 'class="bk-store-footer bk-inverse"' /tmp/bakata-home.html
          grep -F 'logo-negativo.svg' /tmp/bakata-home.html
          grep -F 'footer.css' /tmp/bakata-home.html
          grep -F 'Tus pedidos' /tmp/bakata-home.html
          if grep -Eq 'Información de envíos|Cambios y devoluciones|ci-shipping-public' /tmp/bakata-home.html; then
            echo 'Unconfigured service link exposed'; exit 1
          fi
          php -l scripts/footer-fixtures-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/footer-fixtures-ci.php)"
          curl --fail --silent --show-error http://localhost:8080/ -o /tmp/bakata-footer.html
          grep -F 'ci-shipping-public' /tmp/bakata-footer.html
          grep -F 'ci-privacy-public' /tmp/bakata-footer.html
          if grep -Eq 'ci-returns-draft|ci-contact-protected|ci-terms-private' /tmp/bakata-footer.html; then
            echo 'Nonpublic service page exposed'; exit 1
          fi
      - name: Browser QA — populated catalog and cart
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          docker compose run --rm -T cli wp option update woocommerce_coming_soon no
          npm --prefix qa test
          node --check qa/performance-seo.mjs
          node qa/performance-seo.mjs
      - name: Browser QA — shop filters and pagination
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/shop-fixtures-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/shop-fixtures-ci.php)"
          node qa/shop.mjs
      - name: Browser QA — product detail and variants
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/product-fixtures-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/product-fixtures-ci.php)"
          node --check qa/product.mjs
          node qa/product.mjs
      - name: Browser QA — cart quantities, coupon and removal
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/cart-fixtures-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/cart-fixtures-ci.php)"
          node --check qa/cart.mjs
          node qa/cart.mjs
      - name: Browser QA — Colombian checkout before submission
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/checkout-fixtures-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/checkout-fixtures-ci.php)"
          node --check qa/checkout.mjs
          node qa/checkout.mjs
      - name: Browser QA — customer account and order isolation
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/account-fixtures-ci.php
          export BAKATA_CI_ACCOUNT_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$BAKATA_CI_ACCOUNT_PASSWORD"
          fixture="$(docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 -e BAKATA_CI_ACCOUNT_PASSWORD cli wp eval "$(tail -n +2 scripts/account-fixtures-ci.php)")"
          export BAKATA_CI_OWN_ORDER="$(printf '%s\n' "$fixture" | sed -n 's/^BAKATA_CI_OWN_ORDER=\([0-9]*\)$/\1/p')"
          export BAKATA_CI_OTHER_ORDER="$(printf '%s\n' "$fixture" | sed -n 's/^BAKATA_CI_OTHER_ORDER=\([0-9]*\)$/\1/p')"
          node --check qa/account.mjs
          node qa/account.mjs
      - name: Draft import — isolated WooCommerce CRUD and safety tests
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/test-draft-import-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/test-draft-import-ci.php)"
      - name: Intelligence draft bridge — isolated WooCommerce approval and import
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/test-intelligence-draft-ci.php
          export BAKATA_CI_INTELLIGENCE_SNAPSHOT="$(cat /tmp/bakata-job-result.json)"
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 -e BAKATA_CI_INTELLIGENCE_SNAPSHOT cli wp eval "$(tail -n +2 scripts/test-intelligence-draft-ci.php)"
      - name: Intelligence approved draft — ledger to inert WooCommerce fixture
        env:
          BAKATA_CI_FIXTURES: '1'
          PYTHONPATH: services/intelligence:services/intelligence/tests
        run: |
          export BAKATA_DRAFT_REVIEWER="$(docker compose run --rm -T cli wp user list --role=administrator --field=ID | head -n 1)"
          export BAKATA_DRAFT_CATEGORY="$(docker compose run --rm -T cli wp term create product_cat 'CI Approved Draft Category' --slug=ci-approved-draft-category --porcelain)"
          export BAKATA_CI_APPROVED_DRAFT="$(python3 scripts/fixture-approved-draft.py)"
          php -l scripts/test-approved-draft-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 -e BAKATA_CI_APPROVED_DRAFT cli wp eval "$(tail -n +2 scripts/test-approved-draft-ci.php)"
      - name: Intelligence Dropify — isolated read-only WooCommerce reconciliation
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/test-intelligence-dropify-ci.php
          export BAKATA_CI_INTELLIGENCE_SNAPSHOT="$(cat /tmp/bakata-job-result.json)"
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 -e BAKATA_CI_INTELLIGENCE_SNAPSHOT cli wp eval "$(tail -n +2 scripts/test-intelligence-dropify-ci.php)"
      - name: Order preview — isolated WooCommerce CRUD tests
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/test-order-preview-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/test-order-preview-ci.php)"
      - name: Webhook receipts — isolated MariaDB uniqueness tests
        env:
          BAKATA_CI_FIXTURES: '1'
        run: |
          php -l scripts/test-webhook-ledger-ci.php
          docker compose run --rm -T -e BAKATA_CI_FIXTURES=1 cli wp eval "$(tail -n +2 scripts/test-webhook-ledger-ci.php)"
      - name: Dropify offline tools — syntax and quarantine callbacks
        run: |
          python3 -m py_compile scripts/audit-dropify.py scripts/harden-dropify.py scripts/dropify_security_patch.py scripts/dropify_hpos_patch.py
          docker run --rm -v "$PWD:/src:ro" php:8.3-cli sh -c 'php -l /src/tools/dropify-quarantine/dispatch-reservation.php && php -l /src/scripts/test-dropify-reservation-ci.php && php /src/scripts/test-dropify-guard.php'
      - name: Dropify credential vault — authenticated encryption
        run: |
          python3 -m py_compile scripts/verify-dropify.py
          docker run --rm -v "$PWD:/src:ro" php:8.3-cli php /src/scripts/test-dropify-token-vault.php
      - name: Dropify reservation — concurrent isolated MariaDB claimants
        run: |
          docker compose run --rm -T --no-deps -e BAKATA_CI_FIXTURES=1 -v "$PWD:/bakata-ci:ro" --entrypoint sh cli /bakata-ci/scripts/test-dropify-reservation-ci.sh
      - name: Lighthouse diagnostic report
        if: success()
        continue-on-error: true
        run: |
          mkdir -p qa/reports
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from './qa/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")"
          npm --prefix qa run lighthouse
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homepage-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Clean up
        if: always()
        run: |
          docker compose down -v
          docker compose -f services/intelligence/compose.yaml --profile jobs down -v
  deploy_dev:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.BAKATA_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: bakata-development-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.BAKATA_DEPLOY_ROLE_ARN }}
      MANAGED_INSTANCE_ID: ${{ vars.BAKATA_MANAGED_INSTANCE_ID }}
    steps:
      - name: Deploy validated commit via SSM using OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -n "$MANAGED_INSTANCE_ID"
          umask 077
          token_file=$(mktemp)
          trap 'rm -f "$token_file"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -er .value > "$token_file"
          export AWS_WEB_IDENTITY_TOKEN_FILE="$token_file"
          export AWS_ROLE_SESSION_NAME="bakata-$GITHUB_RUN_ID"
          command_id=$(aws ssm send-command \
            --document-name Bakata-DeployDev --document-version 1 \
            --instance-ids "$MANAGED_INSTANCE_ID" \
            --parameters "Commit=$GITHUB_SHA" --timeout-seconds 300 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 70); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$MANAGED_INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in
              Success) echo "Deploy verified"; exit 0 ;;
              Pending|InProgress|Delayed|Cancelling) sleep 5 ;;
              *) echo "Deploy failed: $status" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM; check command in AWS" >&2
          exit 1
