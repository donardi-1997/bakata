name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate PHP syntax
        run: docker run --rm -v "$PWD/wp-content:/src:ro" php:8.3-cli sh -c 'find /src -name "*.php" -exec php -l {} +'
      - name: Validate theme JSON and shell
        run: |
          python3 -m json.tool wp-content/themes/bakata/theme.json > /dev/null
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n infra/letsencrypt/reload-nginx.sh
          cp .env.example .env
          docker compose config --quiet
      - name: Bootstrap local store
        run: bash scripts/bootstrap.sh
      - name: Smoke test
        run: |
          docker compose run --rm -T cli wp core is-installed
          docker compose run --rm -T cli wp plugin is-active woocommerce
          docker compose run --rm -T cli wp plugin is-active bakata-core
          docker compose run --rm -T cli wp theme is-active bakata
          curl --fail --silent --show-error --retry 5 http://localhost:8080/ | grep -F 'Descubre. Simplifica. Disfruta.'
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Clean up
        if: always()
        run: docker compose down -v
  deploy_dev:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && vars.BAKATA_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: bakata-development-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.BAKATA_DEPLOY_ROLE_ARN }}
      MANAGED_INSTANCE_ID: ${{ vars.BAKATA_MANAGED_INSTANCE_ID }}
    steps:
      - name: Deploy validated commit via SSM using OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -n "$MANAGED_INSTANCE_ID"
          umask 077
          token_file=$(mktemp)
          trap 'rm -f "$token_file"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -er .value > "$token_file"
          export AWS_WEB_IDENTITY_TOKEN_FILE="$token_file"
          export AWS_ROLE_SESSION_NAME="bakata-$GITHUB_RUN_ID"
          command_id=$(aws ssm send-command \
            --document-name Bakata-DeployDev --document-version 1 \
            --instance-ids "$MANAGED_INSTANCE_ID" \
            --parameters "Commit=$GITHUB_SHA" --timeout-seconds 300 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 70); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$MANAGED_INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in
              Success) echo "Deploy verified"; exit 0 ;;
              Pending|InProgress|Delayed|Cancelling) sleep 5 ;;
              *) echo "Deploy failed: $status" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM; check command in AWS" >&2
          exit 1
