name: Dropify catalog validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*dropify*'
      - 'tools/dropify-quarantine/**'
      - 'infra/research-worker/**'
      - '.github/workflows/dropify-catalog-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-package:
    # Independent from Foundation checks; manual packaging runs are not canceled.
    concurrency:
      group: dropify-catalog-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain exact public WordPress distribution (not provider data)
        shell: bash
        run: |
          mkdir -p /tmp/dropify-validation
          curl --fail --silent --show-error --proto '=https' --max-time 45 --max-filesize 1048576 https://downloads.wordpress.org/plugin/wc-dropi-integration.4.7.3.zip -o /tmp/dropify-validation/original.zip
          echo 'bf23c6b1c5dd640aab3d38e3f370a41fbd60139ac60a1ce5f0347a059e9b6700  /tmp/dropify-validation/original.zip' | sha256sum -c -
      - name: Validate all prior hardening and catalog-only build offline
        run: |
          python3 scripts/test-dropify-dev-preflight.py
          python3 scripts/verify-dropify.py /tmp/dropify-validation/original.zip
          python3 scripts/verify-dropify.py /tmp/dropify-validation/original.zip --catalog-only
          python3 scripts/harden-dropify.py /tmp/dropify-validation/original.zip /tmp/dropify-validation/dropify-catalog-validation.zip --catalog-only
          (cd /tmp/dropify-validation && sha256sum dropify-catalog-validation.zip > SHA256SUMS)
      - name: Rehearse verified directory replacement and rollback
        run: |
          python3 scripts/test-dropify-rollout-rehearsal.py
          candidate_sha=$(cut -d ' ' -f 1 /tmp/dropify-validation/SHA256SUMS)
          python3 scripts/dropify-rollout-rehearsal.py /tmp/dropify-validation/original.zip /tmp/dropify-validation/dropify-catalog-validation.zip --candidate-sha256 "$candidate_sha" | tee /tmp/dropify-validation/rollback-rehearsal.json
      - name: Install and test catalog-only package in isolated WordPress and WooCommerce
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --max-filesize 52428800 https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o /tmp/dropify-validation/woocommerce.zip
          bash scripts/test-dropify-wordpress-sandbox.sh /tmp/dropify-validation/dropify-catalog-validation.zip /tmp/dropify-validation/woocommerce.zip
      - name: Rehearse CLI-only Fargate-style research worker without external network
        run: |
          bash scripts/test-dropify-research-worker.sh /tmp/dropify-validation/original.zip /tmp/dropify-validation/dropify-catalog-validation.zip /tmp/dropify-validation/woocommerce.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropify-catalog-only-validation
          path: |
            /tmp/dropify-validation/dropify-catalog-validation.zip
            /tmp/dropify-validation/SHA256SUMS
            /tmp/dropify-validation/rollback-rehearsal.json
          retention-days: 7
          if-no-files-found: error
