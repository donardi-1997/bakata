name: Research credentials and egress validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/research-aws/credential-role.json'
      - 'infra/research-worker/catalog-egress-policy.php'
      - 'services/intelligence/intelligence/research_credentials.py'
      - 'services/intelligence/intelligence/research_egress.py'
      - 'services/intelligence/intelligence/research_proxy.py'
      - 'services/intelligence/tests/test_research_proxy.py'
      - 'infra/research-aws/proxy.Dockerfile'
      - 'services/intelligence/tests/test_research_credentials.py'
      - 'scripts/test-research-credential-role.py'
      - 'scripts/test-research-catalog-egress.php'
      - '.github/workflows/research-credential-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test credential binding and destination policy offline
        env:
          PYTHONPATH: services/intelligence
        run: |
          python3 services/intelligence/tests/test_research_credentials.py -v
          python3 services/intelligence/tests/test_research_proxy.py -v
          python3 scripts/test-research-credential-role.py -v
          php -l infra/research-worker/catalog-egress-policy.php
          php scripts/test-research-catalog-egress.php
      - name: Validate CloudFormation schema
        run: |
          python3 -m venv /tmp/bk-credential-lint
          /tmp/bk-credential-lint/bin/pip install 'cfn-lint>=1.0,<2'
          /tmp/bk-credential-lint/bin/cfn-lint --regions us-east-1 --non-zero-exit-code error --template infra/research-aws/credential-role.json
