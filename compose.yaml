name: bakata
x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:?Define DB_NAME in .env}
  WORDPRESS_DB_USER: ${DB_USER:?Define DB_USER in .env}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
  WORDPRESS_DEBUG: "1"
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:?}
      MARIADB_USER: ${DB_USER:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment: *wordpress-env
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/bakata:/var/www/html/wp-content/themes/bakata:ro
      - ./wp-content/plugins/bakata-core:/var/www/html/wp-content/plugins/bakata-core:ro
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    working_dir: /var/www/html
    environment:
      <<: *wordpress-env
      HOME: /tmp
      WP_URL: ${WP_URL:?}
      WP_TITLE: ${WP_TITLE:-Bakata Store}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?}
      WC_VERSION: ${WC_VERSION:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/bakata:/var/www/html/wp-content/themes/bakata:ro
      - ./wp-content/plugins/bakata-core:/var/www/html/wp-content/plugins/bakata-core:ro
volumes:
  db_data:
  wp_data:
