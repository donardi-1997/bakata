server {
    listen 80;
    server_name dev.bakata.store;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://dev.bakata.store$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name dev.bakata.store;
    ssl_certificate /etc/letsencrypt/live/dev.bakata.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.bakata.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BAKATA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 64M;
    auth_basic "Bakata - Desarrollo privado";
    auth_basic_user_file /etc/nginx/.htpasswd-bakata;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/bakata-dev.access.log;
    error_log /var/log/nginx/bakata-dev.error.log;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host dev.bakata.store;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Authorization "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
