name: bakata-intelligence
services:
  fixture:
    build: .
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  scheduler:
    profiles: ["jobs"]
    build: .
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - job_data:/var/lib/bakata-intelligence
    entrypoint: ["python", "-m", "intelligence.scheduler", "--db", "/var/lib/bakata-intelligence/jobs.sqlite"]
    command: ["list"]
volumes:
  job_data:
